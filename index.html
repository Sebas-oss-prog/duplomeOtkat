<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Слободское РАЙПО</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    :root {
      --bg: #f3efe6;
      --bg-soft: #fbf8f1;
      --panel: rgba(255, 252, 245, 0.88);
      --panel-strong: #fffdf8;
      --text: #1f241d;
      --muted: #5b6257;
      --line: rgba(54, 63, 47, 0.12);
      --accent: #275d38;
      --accent-soft: #dde9da;
      --warn: #b87412;
      --danger: #b13a2f;
      --radius: 20px;
      --shadow: 0 24px 54px rgba(51, 44, 27, 0.12);
      --font-display: "Segoe UI Semibold", "Trebuchet MS", sans-serif;
      --font-body: "Segoe UI", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(39, 93, 56, 0.14), transparent 26%),
        radial-gradient(circle at top right, rgba(184, 116, 18, 0.12), transparent 24%),
        linear-gradient(180deg, #f8f4ea 0%, #f1ebdf 100%);
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 14px 120px;
    }

    .hero {
      position: static;
      top: auto;
      z-index: auto;
      backdrop-filter: blur(18px);
      background: linear-gradient(180deg, rgba(248, 244, 234, 0.95), rgba(248, 244, 234, 0.78));
      border-bottom: 1px solid var(--line);
      margin: 0 0 16px;
      padding: 18px 14px 14px;
    }

    .hero-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(39, 93, 56, 0.08);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 6px;
      font-family: var(--font-display);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      max-width: 720px;
    }

    .session-pill {
      min-width: 160px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 13px;
    }

    .session-pill strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 14px;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar { display: none; }

    .nav button,
    .btn,
    .icon-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 10px 24px rgba(51, 44, 27, 0.06);
    }

    .nav button {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav button.active,
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
    }

    .btn.soft {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn.warn {
      background: rgba(184, 116, 18, 0.12);
      border-color: rgba(184, 116, 18, 0.2);
      color: #8a590c;
    }

    .btn.danger {
      background: rgba(177, 58, 47, 0.1);
      border-color: rgba(177, 58, 47, 0.16);
      color: var(--danger);
    }

    .btn.full { width: 100%; }
    .btn:active,
    .nav button:active,
    .icon-btn:active { transform: scale(0.98); }

    .layout {
      display: grid;
      gap: 16px;
    }

    .screen {
      display: none;
      gap: 16px;
    }

    .screen.active {
      display: grid;
    }

    .card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card {
      padding: 18px;
    }

    .split {
      display: grid;
      gap: 16px;
    }

    .stats-grid,
    .catalog-grid,
    .admin-grid {
      display: grid;
      gap: 14px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.76), rgba(253,249,240,0.9));
      border: 1px solid rgba(39, 93, 56, 0.08);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 22px;
      font-family: var(--font-display);
    }

    .catalog-toolbar,
    .toolbar-row,
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search,
    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      color: var(--text);
      font: inherit;
    }

    input,
    textarea,
    select {
      padding: 12px 14px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }

    .search input {
      border: 0;
      padding: 13px 0;
      background: transparent;
    }

    .catalog-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .product {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(245,239,227,0.92));
      border: 1px solid rgba(39, 93, 56, 0.1);
      min-height: 280px;
    }

    .product-visual {
      height: 136px;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(39, 93, 56, 0.16), rgba(184, 116, 18, 0.18)),
        linear-gradient(180deg, #f5f0e4, #ebe1cf);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--accent);
      font-size: 36px;
      font-weight: 800;
    }

    .product-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product h3,
    .section-title {
      margin: 0;
      font-family: var(--font-display);
    }

    .product h3 {
      font-size: 16px;
      line-height: 1.25;
    }

    .product p,
    .muted,
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .product-foot,
    .line-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-family: var(--font-display);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(39, 93, 56, 0.08);
      color: var(--accent);
    }

    .badge.warn {
      background: rgba(184, 116, 18, 0.13);
      color: #8a590c;
    }

    .badge.danger {
      background: rgba(177, 58, 47, 0.12);
      color: var(--danger);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .line-item,
    .order-card,
    .admin-order,
    .lead-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
    }

    .line-item {
      display: grid;
      gap: 10px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      font-size: 18px;
      font-weight: 800;
      display: grid;
      place-items: center;
    }

    .empty,
    .notice {
      padding: 18px;
      border: 1px dashed rgba(39, 93, 56, 0.2);
      border-radius: 18px;
      background: rgba(255,255,255,0.52);
      color: var(--muted);
      line-height: 1.55;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: linear-gradient(180deg, rgba(243,239,230,0), rgba(243,239,230,0.94) 28%);
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .bottom-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: none;
      grid-template-columns: 1fr auto;
      gap: 12px;
      pointer-events: auto;
    }

    .bottom-inner.visible {
      display: grid;
    }

    .summary-box {
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255,252,245,0.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .summary-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .summary-box strong {
      font-size: 18px;
      font-family: var(--font-display);
    }

    .admin-grid {
      grid-template-columns: 1fr;
    }

    .hidden { display: none !important; }

    .message {
      position: fixed;
      left: 50%;
      bottom: 98px;
      transform: translateX(-50%);
      z-index: 45;
      min-width: min(520px, calc(100vw - 28px));
      max-width: calc(100vw - 28px);
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(31, 36, 29, 0.96);
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .table {
      display: grid;
      gap: 10px;
    }

    .admin-header {
      display: grid;
      gap: 14px;
    }

    .admin-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .admin-kpi {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(241,235,223,0.82));
      border: 1px solid rgba(39, 93, 56, 0.12);
      box-shadow: 0 14px 30px rgba(51, 44, 27, 0.08);
    }

    .admin-kpi span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .admin-kpi strong {
      display: block;
      font-size: 24px;
      font-family: var(--font-display);
    }

    .admin-kpi small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .admin-stack {
      display: grid;
      gap: 16px;
    }

    .admin-toolbar {
      display: grid;
      gap: 10px;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
    }

    .admin-toolbar.compact {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .admin-list {
      display: grid;
      gap: 12px;
    }

    .admin-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
    }

    .admin-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .admin-card-title {
      font-size: 16px;
      font-family: var(--font-display);
    }

    .admin-card-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .admin-two-col {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .admin-recent-list {
      display: grid;
      gap: 10px;
    }

    .admin-recent-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(39, 93, 56, 0.08);
    }

    .admin-empty {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.56);
      border: 1px dashed rgba(39, 93, 56, 0.18);
      color: var(--muted);
    }

    .thumb {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(39, 93, 56, 0.18), rgba(184, 116, 18, 0.18));
    }

    .thumb-placeholder {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--accent);
      background: linear-gradient(135deg, rgba(39, 93, 56, 0.18), rgba(184, 116, 18, 0.18));
    }

    .admin-grid-wide {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .product.clickable {
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .product.clickable:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 38px rgba(51, 44, 27, 0.1);
      border-color: rgba(39, 93, 56, 0.2);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 16px;
      background: rgba(28, 31, 25, 0.56);
      backdrop-filter: blur(10px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: min(920px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 18px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,253,248,0.98), rgba(246,240,229,0.98));
      border: 1px solid rgba(39, 93, 56, 0.14);
      box-shadow: 0 28px 60px rgba(28, 22, 12, 0.2);
    }

    .modal-close-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .modal-close {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      font-size: 20px;
      cursor: pointer;
    }

    .product-modal-layout {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    .product-modal-visual {
      min-height: 260px;
      border-radius: 22px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(39, 93, 56, 0.18), rgba(184, 116, 18, 0.2)),
        linear-gradient(180deg, #f5f0e4, #ebe1cf);
      color: var(--accent);
      font-size: 64px;
      font-weight: 800;
    }

    .product-modal-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-modal-title {
      font-family: var(--font-display);
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.1;
      margin: 0;
    }

    .product-modal-meta {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .product-modal-meta-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(39, 93, 56, 0.08);
    }

    .product-modal-meta-item span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .product-modal-meta-item strong {
      font-size: 15px;
      line-height: 1.4;
    }

    .product-modal-actions {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .product-modal-qty {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(39, 93, 56, 0.08);
      width: fit-content;
    }

    .product-modal-qty strong {
      min-width: 54px;
      text-align: center;
      font-size: 15px;
    }

    .faq-list {
      display: grid;
      gap: 12px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.74);
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .faq-answer {
      display: none;
      padding: 0 18px 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .faq-item.open .faq-answer {
      display: block;
    }

    @media (min-width: 880px) {
      .split {
        grid-template-columns: 1.2fr 0.8fr;
      }

      .catalog-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .admin-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }

      .admin-kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .admin-two-col {
        grid-template-columns: 1.15fr 0.85fr;
      }

      .admin-grid-wide {
        grid-template-columns: 1fr 1fr;
      }

      .product-modal-layout {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 699px) {
      .hero-top {
        flex-direction: column;
      }

      .session-pill {
        width: 100%;
      }

      .catalog-grid,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .bottom-inner.visible {
        grid-template-columns: 1fr;
      }

      .admin-toolbar,
      .admin-toolbar.compact,
      .admin-kpi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="shell">
      <div class="hero-top">
        <div>
          <div class="brand-tag">Личный кабинет</div>
          <h1>Слободское РАЙПО</h1>
          <p>
            Сервис для оформления заявок, просмотра документов и работы по договорам поставки.
          </p>
        </div>
        <div class="session-pill" id="sessionPill">
          <strong>Гость</strong>
          <div>Загрузка данных VK…</div>
        </div>
      </div>
      <div class="nav" id="nav"></div>
    </div>
  </div>

  <main class="shell layout">
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-catalog"></section>
    <section class="screen" id="screen-cart"></section>
    <section class="screen" id="screen-orders"></section>
    <section class="screen" id="screen-docs"></section>
    <section class="screen" id="screen-admin"></section>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner" id="cartBottom">
      <div class="summary-box">
        <span>Корзина</span>
        <strong id="cartSummary">0 позиций · 0.00 ₽</strong>
      </div>
      <button class="btn primary" id="goCheckoutBtn">Оформить заявку</button>
    </div>
  </div>

  <div class="message" id="toast"></div>
  <div class="modal-overlay" id="productModal"></div>

  <script>
    const state = {
      vkId: null,
      role: "guest",
      isAdmin: false,
      contractor: null,
      categories: [],
      products: [],
      filteredProducts: [],
      selectedProduct: null,
      selectedProductQuantity: 1,
      cart: {},
      orders: [],
      documents: [],
      balance: null,
      isSubmittingOrder: false,
      reconciliationDocumentUrl: "",
      admin: {
        stats: null,
        orders: [],
        contractors: [],
        leads: [],
        supportRequests: [],
        documentRequests: [],
        documents: []
      },
      adminUi: {
        orderSearch: "",
        orderStatus: "",
        productSearch: "",
        productCategory: "",
        contractorSearch: "",
        leadSearch: "",
        supportSearch: "",
        supportStatus: ""
      }
    };

    const FAQ_ITEMS = [
      {
        question: "Как оформить заказ?",
        answer: "Выберите товары в каталоге, добавьте их в корзину и подтвердите оформление заявки."
      },
      {
        question: "Как войти в систему?",

    const el = {
      nav: document.getElementById("nav"),

      screens: {
        home: document.getElementById("screen-home"),
        catalog: document.getElementById("screen-catalog"),
        cart: document.getElementById("screen-cart"),
        orders: document.getElementById("screen-orders"),
        docs: document.getElementById("screen-docs"),
        admin: document.getElementById("screen-admin")
      }
    };

    const tabsByRole = {
      guest: [
        { key: "home", label: "Компания" },
        { key: "catalog", label: "Ассортимент" },
        { key: "docs", label: "Сотрудничество" },
        { key: "admin", label: "Помощь" }
      ],

        { key: "home", label: "Кабинет" },

        { key: "orders", label: "Заявки" },
        { key: "docs", label: "Документы" },
        { key: "admin", label: "Помощь" }
      ],
      admin: [
        { key: "home", label: "Обзор" },
        { key: "orders", label: "Заявки" },
        { key: "catalog", label: "Товары" },
        { key: "cart", label: "Контрагенты" },
        { key: "docs", label: "Сотрудничество" },

      ]
    };

    const API_BASE_URL = "https://sebbikkk-raipo-backend.hf.space";

    let currentScreen = "home";

    function api(path, options = {}) {
      const isFormData = options.body instanceof FormData;
      const headers = isFormData ? (options.headers || {}) : { "Content-Type": "application/json", ...(options.headers || {}) };
      return fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers
      }).then(async (response) => {
        const contentType = response.headers.get("content-type") || "";
        const body = contentType.includes("application/json") ? await response.json() : await response.text();
        if (!response.ok) {
          const message = typeof body === "string" ? body : body.detail || body.message || "Ошибка запроса";
          throw new Error(message);
        }
        return body;
      });
    }

    function formatMoney(value) {
      return `${Number(value || 0).toFixed(2)} ₽`;
    }

    function showToast(message, isError = false) {
      el.toast.textContent = message;
      el.toast.style.background = isError ? "rgba(177, 58, 47, 0.96)" : "rgba(31, 36, 29, 0.96)";
      el.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => el.toast.classList.remove("show"), 2600);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function orderStatusLabel(value) {
      return {
        new: "Новая",
        waiting_payment: "Ожидает оплату",
        payment_check: "Проверка оплаты",
        confirmed: "Подтверждена",
        paid: "Оплачена",
        in_production: "В обработке",
        shipped: "Отгружена",
        completed: "Завершена",
        cancelled: "Отменена",
        rejected: "Отклонена"
      }[value] || value || "Не указан";
    }

    function paymentTypeLabel(value) {
      return value === "deferred" ? "Отсрочка платежа" : "Предоплата";
    }

    function displayOrderNumber(order) {
      if (!order) return "";
      return order.order_number || (order.id ? `Заказ #${order.id}` : "Заказ");
    }

    function displayCustomerOrderNumber(order) {
      const value = Number(order?.customer_order_number || 0);
      return value > 0 ? `№${value}` : "";
    }

    function documentTypeLabel(value) {
      return value === "reconciliation_act" ? "Акт сверки" : value === "duplicate_invoice" ? "Дубликат накладной" : value || "Документ";
    }

    function documentRequestStatusLabel(value) {
      return value === "new" ? "Новый" : value === "in_progress" ? "В работе" : value === "done" ? "Выполнен" : value === "rejected" ? "Отклонён" : value || "Не указан";
    }

    function documentStatusLabel(value) {
      return value === "active" ? "Доступен" : value || "Документ";
    }

    function categoryNameById(categoryId) {
      return (state.categories.find((category) => String(category.id) === String(categoryId)) || {}).name || "Не указана";
    }

    function buildNav() {
      const tabs = tabsByRole[state.role] || tabsByRole.guest;
      if (!tabs.some((tab) => tab.key === currentScreen)) {
        currentScreen = tabs[0]?.key || "home";
      }
      el.nav.innerHTML = tabs.map((tab) => `
        <button class="${tab.key === currentScreen ? "active" : ""}" data-screen="${tab.key}">${tab.label}</button>
      `).join("");
      [...el.nav.querySelectorAll("button")].forEach((button) => {
        button.addEventListener("click", () => setScreen(button.dataset.screen));
      });
    }

    function setScreen(screenKey) {
      currentScreen = screenKey;
      Object.entries(el.screens).forEach(([key, node]) => {
        node.classList.toggle("active", key === screenKey);
      });
      buildNav();
      updateCartBar();
    }

    function getCartItems() {
      return Object.values(state.cart);
    }

    function cartTotal() {
      return getCartItems().reduce((sum, item) => sum + item.price * item.quantity, 0);
    }

    function cartCount() {
      return getCartItems().reduce((sum, item) => sum + item.quantity, 0);
    }

    function updateCartBar() {
      const visible = state.role === "partner" && currentScreen !== "cart" && getCartItems().length > 0;
      el.cartBottom.classList.toggle("visible", visible);
      el.cartSummary.textContent = `${cartCount()} шт · ${formatMoney(cartTotal())}`;
    }

    function addToCart(product, quantityOverride = null) {
      if (state.role !== "partner") {
        showToast("Добавление в корзину доступно только контрагентам", true);
        return;
      }
      const existing = state.cart[product.id];
      const minQuantity = Number(product.min_quantity || 1);
      const requestedQuantity = Number(quantityOverride || minQuantity);
      const normalizedQuantity = Math.max(minQuantity, requestedQuantity);
      const nextQuantity = existing ? existing.quantity + normalizedQuantity : normalizedQuantity;
      state.cart[product.id] = {
        product_id: product.id,
        name: product.name,
        price: Number(product.price || 0),
        quantity: nextQuantity,
        min_quantity: minQuantity,
        stock_quantity: Number(product.stock_quantity || 0)
      };
      renderCart();
      updateCartBar();
      showToast(`Добавлено: ${product.name}`);
    }

    function openProductDetails(productId) {
      const product = state.products.find((item) => String(item.id) === String(productId));
      if (!product || state.role === "admin") return;
      state.selectedProduct = product;
      state.selectedProductQuantity = Number(product.min_quantity || 1);
      renderProductModal();
    }

    function closeProductDetails() {
      state.selectedProduct = null;
      state.selectedProductQuantity = 1;
      renderProductModal();
    }

    function changeSelectedProductQuantity(delta) {
      if (!state.selectedProduct || state.role !== "partner") return;
      const minQuantity = Number(state.selectedProduct.min_quantity || 1);
      const stockQuantity = Number(state.selectedProduct.stock_quantity || 0);
      const nextValue = state.selectedProductQuantity + delta;
      if (nextValue < minQuantity) {
        showToast(`Минимальный квант: ${minQuantity}`, true);
        return;
      }
      if (stockQuantity && nextValue > stockQuantity) {
        showToast("Недостаточно товара на складе", true);
        return;
      }
      state.selectedProductQuantity = nextValue;
      renderProductModal();
    }

    function renderProductModal() {
      const product = state.selectedProduct;
      if (!product || state.role === "admin") {
        el.productModal.classList.remove("open");
        el.productModal.innerHTML = "";
        return;
      }

      const canOrder = state.role === "partner";
      const minQuantity = Number(product.min_quantity || 1);
      const quantity = Math.max(minQuantity, Number(state.selectedProductQuantity || minQuantity));
      const categoryName = categoryNameById(product.category_id);
      const composition = product.composition || "Информация уточняется у менеджера.";
      const weightInfo = product.weight || product.package_size || product.package || "Уточняется.";

      el.productModal.innerHTML = `
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="Карточка товара">
          <div class="modal-close-row">
            <button class="modal-close" id="closeProductModalBtn" aria-label="Закрыть">×</button>
          </div>
          <div class="product-modal-layout">
            <div class="product-modal-visual">
              ${product.image ? `<img src="${product.image}" alt="${escapeHtml(product.name || "")}">` : `<span>${escapeHtml(String(product.name || "Т").slice(0, 1))}</span>`}
            </div>
            <div>
              <h2 class="product-modal-title">${product.name}</h2>
              <p class="muted" style="margin-top: 10px;">${product.description || "Подробное описание товара уточняется у менеджера."}</p>
              <div class="product-modal-meta">
                <div class="product-modal-meta-item"><span>Состав</span><strong>${composition}</strong></div>
                <div class="product-modal-meta-item"><span>Вес / фасовка</span><strong>${weightInfo}</strong></div>
                <div class="product-modal-meta-item"><span>Категория</span><strong>${categoryName}</strong></div>
                <div class="product-modal-meta-item"><span>Минимальная партия</span><strong>${minQuantity} шт.</strong></div>
                <div class="product-modal-meta-item"><span>Остаток</span><strong>${Number(product.stock_quantity || 0)} шт.</strong></div>
                <div class="product-modal-meta-item"><span>Цена</span><strong>${formatMoney(product.price)}</strong></div>
              </div>
              <div class="product-modal-actions">
                ${canOrder ? `
                  <div class="product-modal-qty">
                    <button class="icon-btn" id="productQtyDec" type="button">−</button>
                    <strong>${quantity} шт.</strong>
                    <button class="icon-btn" id="productQtyInc" type="button">+</button>
                  </div>
                  <button class="btn primary full" id="productAddToCartBtn" type="button">Добавить в корзину</button>
                ` : `<div class="notice">Для оформления заявки войдите по договору.</div>`}
              </div>
            </div>
          </div>
        </div>
      `;
      el.productModal.classList.add("open");

      document.getElementById("closeProductModalBtn")?.addEventListener("click", closeProductDetails);
      if (canOrder) {
        document.getElementById("productQtyDec")?.addEventListener("click", () => changeSelectedProductQuantity(-minQuantity));
        document.getElementById("productQtyInc")?.addEventListener("click", () => changeSelectedProductQuantity(minQuantity));
        document.getElementById("productAddToCartBtn")?.addEventListener("click", () => {
          addToCart(product, quantity);
          closeProductDetails();
        });
      }
    }

    function setCartQuantity(productId, quantity) {
      const item = state.cart[productId];
      if (!item) return;
      if (quantity <= 0) {
        delete state.cart[productId];
      } else {
        if (quantity < item.min_quantity) {
          showToast(`Минимальный квант: ${item.min_quantity}`, true);
          return;
        }
        if (item.stock_quantity && quantity > item.stock_quantity) {
          showToast("Недостаточно товара на складе", true);
          return;
        }
        item.quantity = quantity;
      }
      renderCart();
      updateCartBar();
    }

    async function fileToBase64(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      let binary = "";
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return btoa(binary);
    }

            description: document.getElementById("newProductDescription").value.trim() || null,
            price: Number(document.getElementById("newProductPrice").value || 0),
            min_quantity: Number(document.getElementById("newProductMinQty").value || 1),
            stock_quantity: Number(document.getElementById("newProductStock").value || 0),
            category_id: Number(document.getElementById("newProductCategory").value),
            image: document.getElementById("newProductImage").value.trim() || null
          })
        });

        event.target.reset();
        await loadCatalog();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

      const scope = el.screens.catalog;

            min_quantity: Number(scope.querySelector(`[data-product-min="${productId}"]`)?.value || 1),

        await loadCatalog();
        renderAdmin();

    async function saveContractor(contractorId) {
      const scope = el.screens.cart;
      try {
        await api(`/admin/contractors/${contractorId}?vk_id=${state.vkId}`, {
          method: "PATCH",

        });

        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function requestReconciliation() {
      try {
        const result = await api(`/documents/reconciliation?vk_id=${state.vkId}`, { method: "POST" });
        await loadDocuments();
        state.reconciliationDocumentUrl = result.document_url || "";
        renderDocs();
        showToast(result.message);
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function submitDuplicateRequest(event) {
      event.preventDefault();
      const orderId = Number(document.getElementById("duplicateOrderId").value);
      if (!orderId) {
        showToast("Введите номер заявки", true);
        return;
      }
      try {
        const result = await api("/documents/duplicate", {
          method: "POST",
          body: JSON.stringify({ vk_id: state.vkId, order_id: orderId })
        });
        showToast(result.message);
        event.target.reset();
        document.getElementById("duplicateForm")?.classList.add("hidden");
        if (state.role === "admin") {
          await loadAdminData();
        }
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function saveOrderStatus(orderId, trigger = null) {
      const scope = trigger?.closest(".action-row") || el.screens.orders;
      const select = scope.querySelector(`[data-order-status="${orderId}"]`) || el.screens.orders.querySelector(`[data-order-status="${orderId}"]`);
      if (!select) {
        showToast("Не удалось определить выбранный статус", true);
        return;
      }
      try {
        await api(`/admin/orders/${orderId}/status?vk_id=${state.vkId}`, {
          method: "PATCH",
          body: JSON.stringify({ status: select.value })
        });
        showToast("Статус заявки обновлён");
        await Promise.all([loadOrders(), loadAdminData()]);
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function toggleDeferred(contractorId) {
      const contractor = state.admin.contractors.find((item) => String(item.id) === String(contractorId));
      if (!contractor) return;
      const nextType = contractor.payment_type === "deferred" ? "prepayment" : "deferred";
      const payload = nextType === "deferred"
        ? { payment_type: "deferred", credit_limit: contractor.credit_limit || 50000, payment_days: contractor.payment_days || 14 }
        : { payment_type: "prepayment", credit_limit: contractor.credit_limit || 0, payment_days: 0 };
      try {
        await api(`/admin/contractors/${contractorId}?vk_id=${state.vkId}`, {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        showToast("Условия договора обновлены");
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function toggleContractorStatus(contractorId) {
      const contractor = state.admin.contractors.find((item) => String(item.id) === String(contractorId));
      if (!contractor) return;
      const nextStatus = contractor.status === "active" ? "blocked" : "active";
      try {
        await api(`/admin/contractors/${contractorId}?vk_id=${state.vkId}`, {
          method: "PATCH",
          body: JSON.stringify({ status: nextStatus })
        });
        showToast("Статус контрагента обновлён");
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function runReminders() {
      try {
        const result = await api(`/admin/reminders/run?vk_id=${state.vkId}`, { method: "POST" });
        showToast(`Напоминаний обработано: ${(result.reminders || []).length}`);
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function approveLead(leadId) {
      try {
        const result = await api(`/admin/leads/${leadId}/approve?vk_id=${state.vkId}`, { method: "POST" });
        showToast(result.warning || result.message || "Заявка одобрена");
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function submitSupportRequest(event) {
      event.preventDefault();
      const subject = document.getElementById("supportSubject")?.value.trim() || "";
      const message = document.getElementById("supportMessage")?.value.trim() || "";
      if (!subject || !message) {
        showToast("Заполните тему и сообщение", true);
        return;
      }
      try {
        await api("/support/request", {
          method: "POST",
          body: JSON.stringify({
            vk_id: state.vkId,
            subject,
            message
          })
        });
        event.target.reset();
        showToast("Обращение отправлено менеджеру");
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function saveSupportRequestStatus(requestId) {
      const select = el.screens.admin.querySelector(`[data-support-status="${requestId}"]`);
      if (!select) return;
      try {
        await api(`/admin/support/${requestId}?vk_id=${state.vkId}`, {
          method: "PATCH",
          body: JSON.stringify({ status: select.value })
        });
        showToast("Статус обращения обновлён");
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function saveDocumentRequestStatus(requestId) {
      const select = el.screens.admin.querySelector(`[data-document-request-status="${requestId}"]`);
      if (!select) return;
      try {
        await api(`/admin/document-requests/${requestId}?vk_id=${state.vkId}`, {
          method: "PATCH",
          body: JSON.stringify({ status: select.value })
        });
        showToast("Статус запроса документа обновлён");
        await loadAdminData();
        renderAdmin();
      } catch (error) {
        showToast(error.message, true);
      }
    }

    async function loadAdminData() {
      if (state.role !== "admin") {
        state.admin = { stats: null, orders: [], contractors: [], leads: [], supportRequests: [], documentRequests: [], documents: [] };
        return;
      }
      const [stats, orders, contractors, leads, supportRequests, documentRequests, documents] = await Promise.all([
        api(`/admin/stats?vk_id=${state.vkId}`),
        api(`/admin/orders?vk_id=${state.vkId}`),
        api(`/admin/contractors?vk_id=${state.vkId}`),
        api(`/admin/leads?vk_id=${state.vkId}`),
        api(`/admin/support?vk_id=${state.vkId}`),
        api(`/admin/document-requests?vk_id=${state.vkId}`),
        api(`/admin/documents?vk_id=${state.vkId}`)
      ]);
      state.admin = { stats, orders, contractors, leads, supportRequests, documentRequests, documents };
    }

    function renderAdmin() {
      if (state.role === "admin") {
        el.screens.admin.innerHTML = renderAdminSupportSection();
        attachAdminSupportEvents();
        return;
      }
      el.screens.admin.innerHTML = renderHelpSection();
      attachHelpEvents();
    }

    async function bootstrapSession() {
      await loadSession();
      await loadCatalog();
      await Promise.all([loadOrders(), loadBalance(), loadDocuments(), loadAdminData()]);
      renderAll();
    }

    function renderAll() {
      renderSessionPill();
      buildNav();
      renderHome();
      renderCatalog();
      renderCart();
      renderOrders();
      renderDocs();
      renderAdmin();
      updateCartBar();
    }

    async function initVk() {
      try {
        await vkBridge.send("VKWebAppInit");
        const userInfo = await vkBridge.send("VKWebAppGetUserInfo");
        state.vkId = userInfo.id;
      } catch (error) {
        console.warn("VK Bridge init failed", error);
        state.vkId = Number(new URLSearchParams(window.location.search).get("vk_user_id")) || 1;
      }
    }

    el.goCheckoutBtn.addEventListener("click", () => setScreen("cart"));
    el.productModal.addEventListener("click", (event) => {
      if (event.target === el.productModal) {
        closeProductDetails();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.selectedProduct) {
        closeProductDetails();
      }
    });

    (async function start() {
      try {
        await initVk();
        await bootstrapSession();
      } catch (error) {
        console.error(error);
        showToast(error.message || "Не удалось загрузить кабинет", true);
      }
    })();
  </script>
